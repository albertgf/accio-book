<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La biblio de ...</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📚 La biblio de ...</h1>
    <div id="auth">
      <span id="user-email"></span>
      <form id="login-form">
        <input type="email" id="login-user" placeholder="you@example.com" autocomplete="username" required>
        <input type="password" id="login-pass" placeholder="password" autocomplete="current-password"
               required minlength="6">
        <button type="submit">Accedeix</button>
      </form>
      <button id="logout-btn" hidden>Sortir</button>
    </div>
  </header>

  <div id="banner" hidden></div>

  <section id="signed-out">
    <h2>Holi! 👋</h2>
    <p>Heu de fer login per veure el llistat de llibres.</p>
  </section>

  <main hidden>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search title, author, ISBN…">
      <select id="genre-filter"><option value="">All genres</option></select>
      <select id="sort">
        <option value="title">Titol A–Z</option>
        <option value="author">Autor A–Z</option>
        <option value="-year">Newest first</option>
        <option value="-created_at">Afegits recentment</option>
      </select>
      <button id="add-btn" hidden>+ Afegeix llibre</button>
    </div>

    <p id="status">Carregant…</p>
    <ul id="books"></ul>
  </main>

  <dialog id="book-dialog">
    <form id="book-form" method="dialog">
      <h2 id="dialog-title">Afegeix llibre</h2>
      <label>Titol* <input name="title" required maxlength="300"></label>
      <label>Autor* <input name="author" required maxlength="200"></label>
      <div class="row">
        <label>Any <input name="year" type="number" min="0" max="2100"></label>
        <label>Genere <input name="genre" list="genres" maxlength="60"></label>
      </div>
      <label>ISBN <input name="isbn" pattern="[0-9Xx\-]{10,17}" placeholder="for the cover image"></label>
      <label>Notes <textarea name="notes" rows="3" maxlength="2000"></textarea></label>
      <datalist id="genres"></datalist>
      <menu>
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
