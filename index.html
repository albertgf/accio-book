<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📚 Book Catalog</h1>
    <div id="auth">
      <span id="user-email"></span>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="you@example.com" required>
        <button type="submit">Sign in</button>
      </form>
      <button id="logout-btn" hidden>Sign out</button>
    </div>
  </header>

  <div id="banner" hidden></div>

  <main>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search title, author, genre…">
      <select id="genre-filter"><option value="">All genres</option></select>
      <select id="sort">
        <option value="title">Title A–Z</option>
        <option value="author">Author A–Z</option>
        <option value="-year">Newest first</option>
        <option value="-created_at">Recently added</option>
      </select>
      <button id="add-btn" hidden>+ Add book</button>
    </div>

    <p id="status">Loading…</p>
    <ul id="books"></ul>
  </main>

  <dialog id="book-dialog">
    <form id="book-form" method="dialog">
      <h2 id="dialog-title">Add book</h2>
      <label>Title* <input name="title" required maxlength="300"></label>
      <label>Author* <input name="author" required maxlength="200"></label>
      <div class="row">
        <label>Year <input name="year" type="number" min="0" max="2100"></label>
        <label>Genre <input name="genre" list="genres" maxlength="60"></label>
      </div>
      <label>ISBN <input name="isbn" pattern="[0-9Xx\-]{10,17}" placeholder="for the cover image"></label>
      <label>Notes <textarea name="notes" rows="3" maxlength="2000"></textarea></label>
      <datalist id="genres"></datalist>
      <menu>
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
